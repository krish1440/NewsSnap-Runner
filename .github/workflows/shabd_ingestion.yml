name: Automated PB-SHABD News Ingestion Worker

on:
  schedule:
    # Run automatically every 3 hours (8 times per day, 100% UNLIMITED FREE on Public Repo)
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      ingestion_limit:
        description: 'Number of news stories to process per run'
        required: false
        default: '100'

# Prevent simultaneous parallel runs; sequence runs if previous one is still executing
concurrency:
  group: shabd-public-worker
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: Run News Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 120 # Cap at 2 hours max per run

    steps:
      - name: Check API Pipeline Status (Prevent Duplicate Runs)
        env:
          RENDER_API_URL: ${{ secrets.RENDER_API_URL }}
        run: |
          python3 -c '
          import os, sys, urllib.request, json
          url = os.environ.get("RENDER_API_URL", "").rstrip("/")
          if url:
              try:
                  req = urllib.request.urlopen(f"{url}/api/news/pipeline-status", timeout=10)
                  data = json.loads(req.read().decode())
                  if data.get("is_running") == True:
                      print("⚠️ Pipeline is ALREADY RUNNING. Skipping execution.")
                      sys.exit(1)
              except Exception as e:
                  print(f"Status check skipped: {e}")
          print("✅ Pipeline status clear! Proceeding with news ingestion.")
          '

      - name: Checkout Private Backend Code
        uses: actions/checkout@v4
        with:
          repository: 'kc1404/NewsSnap'
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-noto \
            libraqm-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run News Ingestion Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEYS }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          CLOUDINARY_ACCOUNTS: ${{ secrets.CLOUDINARY_ACCOUNTS }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SHABD_EMAIL: ${{ secrets.SHABD_EMAIL }}
          SHABD_PASSWORD: ${{ secrets.SHABD_PASSWORD }}
          INGESTION_LIMIT: ${{ inputs.ingestion_limit || '100' }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m backend.pipeline

      - name: Run 3-Day Retention Storage Cleanup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_ACCOUNTS: ${{ secrets.CLOUDINARY_ACCOUNTS }}
        run: |
          python -m backend.cleanup_old_news --days 3

      - name: Package News Stories into Zip Archive (0 Cloudinary Bandwidth)
        if: always()
        run: |
          mkdir -p zip_archives
          if [ -d "archive_bundles" ]; then
            zip -r "zip_archives/news_stories_$(date +'%Y-%m-%d_%H-%M').zip" archive_bundles/ || true
          fi

      - name: Upload News Zip Artifact to GitHub
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-stories-zip
          path: zip_archives/*.zip
          retention-days: 30
